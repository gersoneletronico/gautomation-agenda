name: Iniciar ambiente

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 Brasilia/Fortaleza
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Iniciar ambiente no Jelastic
        env:
          JELASTIC_TOKEN: ${{ secrets.JELASTIC_TOKEN }}
          ENV_NAME: gautomation
          API_HOST: app.jelastic.saveincloud.net
        run: |
          set -euo pipefail
          resp=$(curl -sS --fail --retry 3 --max-time 120             --data-urlencode "session=$JELASTIC_TOKEN"             --data-urlencode "envName=$ENV_NAME"             "https://$API_HOST/1.0/environment/control/rest/startenv")
          echo "$resp" | sed 's/"session":"[^"]*"/"session":"***"/g'
          echo "$resp" | grep -q '"result":0' || { echo "Falha na API do Jelastic"; exit 1; }
